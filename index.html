<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Teste TWGL</title>
    </head>
    <body>
        <canvas id="canvas" width="500" height="500"></canvas>
        <div>
            <label>Dia (segundos): <input id="tempo-dia" type="number" min="1" step="1" value="30"></label>
            <label>Noite (segundos): <input id="tempo-noite" type="number" min="1" step="1" value="30"></label>
        </div>
        <p>WASD: mover o Jigglypuff.</p>
        <p>P: descansar ou voltar a passear (sentado de dia, deitado de noite).</p>
        <p id="estado-cubone"></p>
        <p id="noites-evolucao">Faltam 10 noites para evoluir.</p>
        <p>1: camera automatica. 2: orbital (arraste o mouse). 3: seguir Jigglypuff. Scroll: aproximar e afastar.</p>

        <script src="https://twgljs.org/dist/7.x/twgl-full.min.js"></script>
        <script src="scripts/geometria.js"></script>
        <script src="scripts/texturas.js"></script>
        <script src="scripts/glb-loader.js"></script>
        <script src="scripts/keys.js"></script>
        <script type="module" src="script.js"></script>
    </body>
</html>
